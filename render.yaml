services:
  - type: web
    name: occu-med-backend
    runtime: node
    buildCommand: npm ci
    startCommand: npm run start:backend
    plan: starter
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: FRONTEND_APP_URL
        sync: false
      - key: INVITATION_TTL_DAYS
        value: "30"
      - key: PROVIDER_RESPONSES_TO
        sync: false
      - key: ENVELOPE_PREFIX
        value: "OM"
      - key: NODE_ENV
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: web
    name: occu-med-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
